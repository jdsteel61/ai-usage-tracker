name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run package:release
      - name: Upload portable ZIP and SHA256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: ai-usage-tracker-windows-x64
          path: |
            dist/releases/**/*.zip
            dist/releases/**/*.zip.sha256
          if-no-files-found: error
          retention-days: 30
